             <div class="form-grid">
      
      
      <div class="inquiry-section">
        <h3 class="inquiry-title">Inquiry type</h3>
        <div class="inquiry-options">
          <label class="inquiry-label">
            <input type="radio" name="inquiry" value="general" class="inquiry-radio">
            <span>General inquiry</span>
          </label>
          <label class="inquiry-label">
            <input type="radio" name="inquiry" value="collaboration" class="inquiry-radio">
            <span>Collaboration</span>
          </label>
          <label class="inquiry-label">

          </label>
          <label class="inquiry-label">
            <input type="radio" name="inquiry" value="sponsorship" class="inquiry-radio">

          </label>
          <label class="inquiry-label">

        </div>
      </div>


      <div class="interests-section">

          </label>
          <label class="interests-label">
